</style></head><body>

e", "d": "AI-powered platform for technical and HR interview practice with question generation, answer evaluation, scoring, improvement suggestions, and personalized learning roadmaps.", "w": "07/2026", "tags": ["Python", "Streamlit", "Ollama", "Qwen3"], "l": "https://github.com/Shashidhargoudsangam/AI-Interview-Preparation-Assistant"}], "skills": ["Generative AI", "Agentic AI", "Machine Learning", "Python (FastAPI)", "SQL", "Java", "Data Structures & Algorithms", "Computer Networks", "Salesforce Trailhead", "Excel", ""], "awards": [{"t": "SIH 2024", "d": "Top 36"}, {"t": "Hack4SDG 2024", "d": "Finalist"}, {"t": "BITS Pilani Start-up Proposal 2024", "d": "Semi-finalist"}, {"t": "AWS Gen AI", "d": "Certificate"}, {"t": "Salesforce Agentforce Specialist", "d": "Certificate"}, {"t": "CCNA", "d": "Certificate"}], "journey": [{"t": "Vice President — Luminos Science and Spirituality Club", "w": "08/2026 – Present", "d": "Leading the organization and execution of technical and non-technical events, building leadership, communication, teamwork and time-management skills."}, {"t": "Organising Lead — SIH 2025", "w": "09/2025 – 10/2025", "d": "Led organisation for Smart India Hackathon 2025."}, {"t": "AWS Builder Center Workshop 2026", "w": "HITEX Exhibition Centre, Hyderabad", "d": "Hands-on workshop on AWS services, cloud computing, technical problem-solving and builder-oriented learning."}, {"t": "Hack4SDG — 24-Hour Hackathon", "w": "Hyderabad", "d": "24 hours of innovation, problem-solving and teamwork building technology-driven solutions."}, {"t": "MUGFH Milestone 1.0", "w": "Hyderabad", "d": "Participated in the MUGFH Milestone 1.0 event."}], "cta": "Let's build something extraordinary."}</script>
<script>

// reveal + counters
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');e.target.querySelectorAll('[data-to]').forEach(c=>{if(c.dataset.d)return;c.dataset.d=1;const t=parseFloat(c.dataset.to),dec=(c.dataset.to.split('.')[1]||'').length,s=performance.now();(function f(n){const k=Math.min(1,(n-s)/1600),v=t*(1-Math.pow(1-k,4));if(!document.body.classList.contains('editing'))c.textContent=v.toFixed(dec);if(k<1)requestAnimationFrame(f);else c.textContent=c.dataset.to})(s)});io.unobserve(e.target)}),{threshold:.15});

// scroll bar, glow, tilt, magnetic

let mx=innerWidth/2,my=innerHeight/3;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;document.documentElement.style.setProperty('--mx',mx+'px');document.documentElement.style.setProperty('--my',my+'px')});

document.querySelectorAll('.mg').forEach(b=>{b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`});b.addEventListener('pointerleave',()=>b.style.transform='')});
// particle network
const cv=$('#cv'),x=cv.getContext('2d');let W,H,P=[];const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/18|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:Math.random()-.5,vy:Math.random()-.5}))};rs();addEventListener('resize',rs);
(function dr(){x.clearRect(0,0,W,H);const col=getComputedStyle(document.documentElement).getPropertyValue('--b').trim()||'#0cf';x.fillStyle=x.strokeStyle=col;P.forEach((p,i)=>{p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;x.globalAlpha=.5;x.fillRect(p.x,p.y,2,2);for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){x.globalAlpha=(1-d/130)*.18;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}const d=Math.hypot(p.x-mx,p.y-my);if(d<170){x.globalAlpha=(1-d/170)*.5;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(mx,my);x.stroke()}});requestAnimationFrame(dr)})();
// owner-only live editing
(async()=>{try{const u=await claude.use('user');if(!u||!u.isOwner())return;const ui=$('#ui');ui.innerHTML='<button id="ed">✎ Edit portfolio</button>';
